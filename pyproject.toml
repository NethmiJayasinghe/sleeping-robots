[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeping-robots"
version = "1.0.0"
description = "Offline skill consolidation for a shared robot policy (Meta-World MT5)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nethmi Jayasinghe" }]
keywords = ["continual-learning", "reinforcement-learning", "robotics", "meta-world"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "metaworld>=3.0",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["sleeping_robots", "sleeping_robots.phases"]

[tool.pytest.ini_options]
testpaths = ["tests"]
